name: build-ipa
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: 
          targets: aarch64-apple-ios
          
      - name: Build idevice FFI
        run: |
          rm -rf vendor/idevice
          git clone --depth 1 https://github.com/jkcoxson/idevice.git vendor/idevice
          cd vendor/idevice/ffi
          cargo build --release --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/libidevice_ffi.a ../../ThreeOneOSFive/
          
      - name: Link idevice to Xcode Project
        run: |
          # Detyrojme Xcode te lidhe librarine
          sed -i '' 's/OTHER_LDFLAGS = (/OTHER_LDFLAGS = (\n\t\t\t\t"-lidevice_ffi",/' ThreeOneOSFive.xcodeproj/project.pbxproj
          sed -i '' 's/LIBRARY_SEARCH_PATHS = (/LIBRARY_SEARCH_PATHS = (\n\t\t\t\t"$(SRCROOT)\/ThreeOneOSFive",/' ThreeOneOSFive.xcodeproj/project.pbxproj
          
      - name: Build Xcode Project
        run: |
          xcodebuild -project zadaDMA.xcodeproj -scheme 3105 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            
      - name: Package IPA
        run: |
          rm -rf pkg && mkdir -p pkg/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" pkg/Payload/
          (cd pkg && zip -ry ../zadaDMA-unsigned.ipa Payload)
          
      - uses: actions/upload-artifact@v4
        with:
          name: zadaDMA-ipa
          path: zadaDMA-unsigned.ipa
